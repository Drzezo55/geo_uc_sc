name: snakemake_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base=4.4.3 # IMPORTANT: Use the exact R version you've installed in your snakemake_env
  - r-seurat=5.3.0 # Or whatever version you need
  - r-stringi=1.8.7 # Or whatever version you need
  # Add ALL other R packages your script needs. Snakemake will ensure these are available.
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-patchwork
  - r-reticulate
  - r-matrix
  - r-nlme
  - r-cluster
  - r-plotly
  - r-cowplot
  - r-ggrepel
  - r-ggridges
  - r-sctransform
  - r-rtsne
  - r-uwot
  - r-mass
  - r-rocr
  - r-kernsmooth
  - r-data.table
  - r-rcpp
  - r-rcpparmadillo
  - r-rcppeigen
  - r-rcpphnsw
  - r-rcppannoy
  - r-rspectra
  - r-irlba
  - r-leidenbase
  - r-spam
  - r-dotcall64
  - r-spatstat.utils
  - r-spatstat.sparse
  - r-spatstat.data
  - r-spatstat.univar
  - r-spatstat.geom
  - r-spatstat.explore
  - r-deldir
  - r-polyclip
  - r-spam
  - r-magrittr
  - r-glue
  - r-rlang
  - r-withr
  - r-vctrs
  - r-pillar
  - r-tibble
  - r-pkgconfig
  - r-generics
  - r-lifecycle
  - r-crayon
  - r-fs
  - r-rappdirs
  - r-matrixstats
  - r-seuratobject
  # Add system dependencies often required for R package compilation
  - libicu # For stringi
  - clang # C/C++ compiler for macOS
  - make
  - compilers # General package for build tools
# config/config.yaml

output_files:
  - bulk_only_genes.csv
  - CD8_Violin_by_disease.jpg
  - CD8_Violin_by_patient.jpg
